<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07 - Introdução ao Javascript</title>
</head>
<body>
    <h1>Introdução ao Javascript</h1>
</body>
    <!-- Codigo do Javascript -->
<script>
    // Dispara uma janela de alerta
   window.alert('Bem-vindo ao meu primeiro site com Javascript!')
   // Dispara uma janela de confirmação
   window.confirm('Vamos começar a aprender sobre variáveis?')

   // ARMAZENANDO O NOME DO USUÁRIO EM UMA VARIÁVEL
   const nome = window.prompt('Qual é o seu nome?');

   let idade = window.prompt('Insira sua idade atual');
   // prompt -> abre uma janela de inserção de dados
   
   /* COMENTÁRIO 
   DE LINHAS */

   // COMENTÁRIO ÚNICA LINHA

   // ESCREVENDO NO SITE
   // CONCATENAÇÃO COMUM
   // document.write("Olá " + nome + '! Vamos aprender sobre variáveis!<br> Sua idade é: '+ idade + ' anos!')
   // CONCATENAÇÃO (TEMPLATE STRINGS)
   document.write(`Olá, ${nome}! Vamos começar!<br>Atualmente sua idade é ${idade} anos!<br>`);

   // CONVERSÃO DE DADOS
   const n1 = Number(window.prompt('Digite um número'));
   const n2 = Number(window.prompt('Digite outro número'));
   const resultado = n1 + n2;
   document.write(`A soma de ${n1} + ${n2} é igual a: ${resultado} <br>`)

   // Solicite dois números ao usuário e retorne as 4 operações básicas (soma, subtração, multiplicação e divisão)


</script>

</html>
