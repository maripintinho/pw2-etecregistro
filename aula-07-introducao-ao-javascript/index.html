<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações</title>
</head>
<body>
    <h1>Operações Básicas</h1>
</body>
<script>
    // Solicite dois números ao usuário e retorne as 4 operações básicas (soma, subtração, multiplicação e divisão)
    const num1 = Number(window.prompt("Digite o primeiro número"));
    const num2 = Number(window.prompt("Digite o segundo número"));
    const soma = num1 + num2;
    const s = num1 - num2;
    const m = num1 * num2;
    const divi = num1 / num2;
    document.write(`O resultado da soma é: ${soma} <br>O resultado da subtração é: ${s}<br> O resultado da multiplicação é: ${m}<br>O resultado da divisão é: ${divi}`);
</script>
</html>
